[package]
name = "secutils"
version = "1.0.0-beta.2"
authors = ["Aleh Zasypkin <dev@secutils.dev>"]
description = "An open-source, versatile, yet simple security toolbox for engineers and researchers."
edition = "2024"

[lib]
name = "secutils"
path = "src/lib.rs"
# The `src/js_runtime.rs` test suite references crate-level modules
# (`utils::*`, `network::*`) that are only wired up by `src/main.rs`. Those
# tests are gated behind the `bin-tests` Cargo feature (off by default) and
# run via `cargo test --bin secutils --features bin-tests`. Disabling the lib
# test target is a belt-and-braces hint for `cargo test --workspace`.
test = false

[[bin]]
name = "secutils"
path = "src/main.rs"

[workspace]
members = [
    "benches/js-runtime-perf",
    "components/secutils-jwt-tools"
]

[dependencies]
actix-web = "4.15.0"
actix-web-httpauth = "0.8.3"
addr = { version = "0.15.6", default-features = false }
anyhow = "1.0.104"
async-stream = "0.3.6"
brotli = "9.0.0"
byte-unit = "5.2.6"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.7"
content-security-policy = "0.9.0"
croner = "4.0.1"
dashmap = "6.2.1"
deno_core = "0.412.0"
deno_error = "0.7.1"
directories = "6.0.0"
dotenvy = "0.15.7"
figment = "0.10.19"
flate2 = "1.1.10"
futures = "0.3.34"
handlebars = "6.4.4"
hex = "0.4.3"
html5ever = "0.40.1"
http = "1.5.0"
humantime = "2.4.0"
itertools = "0.15.0"
jsonwebtoken = {version = "11.1.0", default-features = false }
lettre = { version = "0.11.23", default-features = false }
openssl = "0.10.81"
postcard = { version = "1.1.3", default-features = false }
getrandom = "0.4.3"
regex = "1.13.1"
reqwest = "0.13.5"
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
reqwest-tracing = "0.7.1"
retrack-types = { path = "components/retrack/components/retrack-types" }
rust-embed = "8.13.0"
serde = "1.0.229"
serde_bytes = "0.11.19"
serde_derive = "1.0.229"
serde_json = "1.0.154"
similar = "3.2.0"
serde_repr = "0.1.21"
serde_with = "3.24.0"
sqlx = { version = "0.9.0", default-features = false }
tantivy = "0.26.2"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.2"
tokio-cron-scheduler = "0.15.1"
tracing = "0.1.44"
tracing-actix-web = "0.7.25"
tracing-subscriber = "0.3.23"
hickory-resolver = "0.26.1"
url = "2.5.8"
utoipa = "6.0.0"
utoipa-scalar = "0.4.0"
urlencoding = "2.1.3"
uuid = "1.28.0"
zip = { version = "9.0.1", default-features = false }
zstd = "0.14.2"
argon2 = "0.6.0"
base64ct = "1.8.3"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7.0"

[dev-dependencies]
ctor = "1.0.9"
httpmock = "0.8.3"
insta = "1.49.0"
toml = "1.1.8"

[features]
default = [
    "addr/std",
    "bytes/serde",
    "clap/cargo",
    "clap/env",
    "content-security-policy/serde",
    "figment/env",
    "figment/toml",
    "handlebars/rust-embed",
    "insta/filters",
    "insta/json",
    "insta/redactions",
    "insta/toml",
    "jsonwebtoken/rust_crypto",
    "lettre/builder",
    "lettre/smtp-transport",
    "lettre/tokio1-rustls-tls",
    "postcard/use-std",
    "reqwest/gzip",
    "reqwest/json",
    "reqwest-middleware/json",
    "reqwest-retry/tracing",
    "serde_json/arbitrary_precision",
    "serde_with/time_0_3",
    "sqlx/json",
    "sqlx/macros",
    "sqlx/migrate",
    "sqlx/runtime-tokio",
    "sqlx/tls-rustls-ring",
    "sqlx/postgres",
    "sqlx/time",
    "sqlx/uuid",
    "time/formatting",
    "time/macros",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/sync",
    "tokio-cron-scheduler/postgres_storage",
    "tracing-actix-web/uuid_v7",
    "tracing-subscriber/env-filter",
    "tracing-subscriber/json",
    "url/serde",
    "utoipa/actix_extras",
    "utoipa/time",
    "utoipa/uuid",
    "utoipa-scalar/actix-web",
    "uuid/v7",
    "zip/deflate"
]

# Tests that reach for crate-level modules (`crate::utils::*`, `crate::network::*`)
# not exposed by `src/lib.rs`. Enabled by the binary's test runner
# (`cargo test --bin secutils --features bin-tests`) but left off by default so
# `cargo clippy --all --all-targets -- -D warnings` can lint the lib as a test
# without hitting unresolved imports.
bin-tests = []

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
