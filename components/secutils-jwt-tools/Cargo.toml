[package]
name = "secutils-jwt-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive"] }
env_logger = "0.11.11"
humantime = "2.4.0"
jsonwebtoken = {version = "10.4.0", default-features = false }
serde_json = "1.0.150"
time = "0.3.53"

[features]
default = [
    "jsonwebtoken/rust_crypto"
]
