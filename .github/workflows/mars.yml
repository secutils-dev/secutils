name: MARS

permissions:
  contents: read

# ci.yml ignores dev/tools/**; this workflow covers MARS and the shared source inventory.
on:
  push:
    branches: [ main ]
    paths:
      - 'dev/tools/**'
      - 'scripts/tools-layout.test.ts'
      - 'scripts/tools-shared.test.ts'
      - 'scripts/mars-test-scopes.test.ts'
      - 'scripts/mars-test-cleanup.ts'
      - 'e2e/mars-test-scopes.ts'
      - 'e2e/tools/_mars_test.ts'
      - 'e2e/tools/registry.ts'
      - '.github/workflows/mars.yml'
  pull_request:
    paths:
      - 'dev/tools/**'
      - 'scripts/tools-layout.test.ts'
      - 'scripts/tools-shared.test.ts'
      - 'scripts/mars-test-scopes.test.ts'
      - 'scripts/mars-test-cleanup.ts'
      - 'e2e/mars-test-scopes.ts'
      - 'e2e/tools/_mars_test.ts'
      - 'e2e/tools/registry.ts'
      - '.github/workflows/mars.yml'

jobs:
  mars:
    name: MARS logic and search quality (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/tools/mars
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            dev/tools/mars/package-lock.json
            dev/tools/mars/eval/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix eval ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: |
          npm test
          node --test ../../../scripts/tools-shared.test.ts ../../../scripts/tools-layout.test.ts
          node --test ../../../scripts/mars-test-scopes.test.ts

      # Best quality (EmbeddingGemma 2, about 200 MB) is checked locally; see README.md#evaluation.
      - name: Cache the Best speed model
        uses: actions/cache@v6.1.0
        with:
          path: dev/tools/mars/eval/.cache
          key: mars-search-models-v2-${{ hashFiles('dev/tools/mars/src/search/models.ts') }}
          restore-keys: mars-search-models-v2-

      - name: Search quality (Best speed, CPU and WebGPU weights)
        run: npm --prefix eval run eval -- fast@q8 fast@fp16 --check
